[package]
name = "soundscene"
version = "0.6.0"
edition = "2024"
description = "Sound-reactive demoscene effects for the terminal"
license = "MIT"
repository = "https://github.com/voidNK/SoundScene"
readme = "README.md"
keywords = ["demoscene", "visualizer", "terminal", "audio", "music"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
crossterm = "0.28"
rustfft = "6.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
